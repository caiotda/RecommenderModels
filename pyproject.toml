[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recmodels"
version = "0.1.0"
description = "A Python package for recommender models, including BPR-MF, IKNN and GRU4Rec."
readme = "README.md"
requires-python = ">=3.9"


dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "tqdm"]

[tool.setuptools.packages.find]
where = ["."]
